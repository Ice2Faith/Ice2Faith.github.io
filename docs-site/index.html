<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="Cache-Control" content="max-age=3600, public">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>文档查看器</title>

    <!-- markdown-it 解析 -->
    <script src="./lib/markdown-it@14.1.1/dist/markdown-it.min.js"></script>

    <!-- highlight.js 核心高亮库 -->
    <script src="./lib/highlight.js/11.11.1/highlight.min.js"></script>
    <link id="hljs-css" rel="stylesheet" href="./lib/highlight.js/11.11.1/styles/github.min.css"/>

    <!-- KaTeX 数学公式 -->
    <link rel="stylesheet" href="./lib/katex@0.16.9/dist/katex.min.css">
    <script src="./lib/katex@0.16.9/dist/katex.min.js"></script>
    <script src="./lib/markdown-it-texmath@1.0.0/texmath.min.js"></script>

    <!-- Panzoom 用于 Mermaid 图表缩放 -->
    <script src="./lib/@panzoom/panzoom@4.4.3/dist/panzoom.min.js"></script>

    <!-- GSAP 动画库 -->
    <script src="./lib/gsap@3.12.5/dist/all.js"></script>
    <script src="./lib/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="./lib/gsap@3.12.5/dist/CSSRulePlugin.min.js"></script>
    <script src="./lib/gsap@3.12.5/dist/CustomEase.min.js"></script>
    <script src="./lib/gsap@3.12.5/dist/Draggable.min.js"></script>
    <script src="./lib/gsap@3.12.5/dist/EaselPlugin.min.js"></script>
    <script src="./lib/gsap@3.12.5/dist/EasePack.min.js"></script>
    <script src="./lib/gsap@3.12.5/dist/Flip.min.js"></script>
    <script src="./lib/gsap@3.12.5/dist/MotionPathPlugin.min.js"></script>
    <script src="./lib/gsap@3.12.5/dist/Observer.min.js"></script>
    <script src="./lib/gsap@3.12.5/dist/PixiPlugin.min.js"></script>
    <script src="./lib/gsap@3.12.5/dist/ScrollToPlugin.min.js"></script>
    <script src="./lib/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="./lib/gsap@3.12.5/dist/TextPlugin.min.js"></script>

    <!-- 基础 Markdown 样式 -->
    <link rel="stylesheet" href="./assets/markdown-styles.css">

    <style>
        /* ===== 基础重置 ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --sidebar-width: 280px;
            --toc-width: 240px;
            --header-height: 52px;
            --bg: #f6f8faaa;
            --surface: #ffffff77;
            --border: #e1e4e8;
            --text: #24292f;
            --text-muted: #6e7781;
            --accent: #0969da;
            --accent-hover: #0550ae;
            --code-bg: #f6f8faaa;
            --sidebar-bg: #f0f2f5dd;
            --toc-active: #0969da;
            --scrollbar: #c8ccd0;
        }

        html { font-size: 15px; scroll-behavior: smooth; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
            background: var(--bg); color: var(--text);
            height: 100vh; overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* ===== 顶部导航栏 ===== */
        #top-bar {
            height: var(--header-height); background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; padding: 0 16px; gap: 12px;
            flex-shrink: 0; z-index: 100;
            box-shadow: 0 1px 4px rgba(0,0,0,.06);
        }
        #top-bar .logo {
            font-size: 1rem; font-weight: 700; color: var(--accent);
            letter-spacing: .3px; white-space: nowrap; flex-shrink: 0;
        }
        #breadcrumb {
            display: flex; align-items: center; gap: 4px;
            font-size: .82rem; color: var(--text-muted); overflow: hidden; flex: 1;
        }
        #breadcrumb span { white-space: nowrap; }
        #breadcrumb .sep { color: var(--border); }
        #breadcrumb .current {
            color: var(--text); font-weight: 500;
            overflow: hidden; text-overflow: ellipsis;
        }
        #top-bar .home-btn {
            cursor: pointer; color: var(--accent); font-size: .82rem;
            text-decoration: none; padding: 4px 8px; border-radius: 6px;
            border: 1px solid var(--border); background: var(--surface);
            white-space: nowrap; transition: background .15s; flex-shrink: 0;
        }
        #top-bar .home-btn:hover { background: var(--bg); }

        /* ===== 主布局 ===== */
        #layout { display: flex; flex: 1; overflow: hidden; }

        /* ===== 左侧边栏 ===== */
        #sidebar {
            width: var(--sidebar-width); background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden;
            transition: width 0.22s ease;
        }
        body.sidebar-collapsed #sidebar { width: 0; border-right-width: 0; }

        #sidebar-header {
            padding: 12px 14px 8px; font-size: .72rem; font-weight: 600;
            color: var(--text-muted); text-transform: uppercase; letter-spacing: .6px;
            border-bottom: 1px solid var(--border); flex-shrink: 0;
        }
        #toc-container { flex: 1; overflow-y: auto; padding: 8px 0; }
        #toc-container::-webkit-scrollbar { width: 4px; }
        #toc-container::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 2px; }

        .toc-item {
            display: block; padding: 5px 14px 5px calc(14px + var(--indent, 0px));
            font-size: .83rem; color: var(--text); text-decoration: none;
            border-left: 2px solid transparent; line-height: 1.45; cursor: pointer;
            transition: background .1s, color .1s, border-color .1s;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .toc-item:hover { background: rgba(9,105,218,.06); color: var(--accent); }
        .toc-item.active { color: var(--toc-active); border-left-color: var(--toc-active); background: rgba(9,105,218,.07); font-weight: 500; }
        .toc-item.h1 { --indent: 0px; font-weight: 600; }
        .toc-item.h2 { --indent: 10px; }
        .toc-item.h3 { --indent: 20px; font-size: .8rem; color: var(--text-muted); }
        .toc-item.h4 { --indent: 30px; font-size: .78rem; color: var(--text-muted); }
        .toc-item.h5, .toc-item.h6 { --indent: 38px; font-size: .76rem; color: var(--text-muted); }

        /* ===== 内容区域 ===== */
        #content-wrap { flex: 1; overflow-y: auto; padding: 0; background: var(--bg); }
        #content-wrap::-webkit-scrollbar { width: 6px; }
        #content-wrap::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }
        #content {
            margin: 0 auto; padding: 36px 40px 80px;
            background: var(--surface); min-height: 100%;
            box-shadow: 0 0 0 1px var(--border);
        }

        /* ===== 加载/错误状态 ===== */
        #loading, #error-msg {
            display: flex; align-items: center; justify-content: center;
            padding: 80px 20px; font-size: .9rem; color: var(--text-muted);
            flex-direction: column; gap: 12px;
        }
        #error-msg { color: #cf222e; }
        .spinner {
            width: 28px; height: 28px; border: 3px solid var(--border);
            border-top-color: var(--accent); border-radius: 50%;
            animation: spin .7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== Markdown 内容样式 ===== */
        #content h1, #content h2, #content h3,
        #content h4, #content h5, #content h6 {
            margin-top: 1.6em; margin-bottom: .5em; font-weight: 600;
            line-height: 1.3; color: var(--text);
            scroll-margin-top: calc(var(--header-height) + 16px);
        }
        #content h1 { font-size: 1.75rem; padding-bottom: .4em; border-bottom: 2px solid var(--border); }
        #content h2 { font-size: 1.3rem; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
        #content h3 { font-size: 1.1rem; }
        #content h4 { font-size: 1rem; }
        #content h5 { font-size: .9rem; }
        #content h6 { font-size: .85rem; color: var(--text-muted); }
        #content p { margin: .75em 0; line-height: 1.75; }
        #content ul, #content ol { margin: .6em 0 .6em 1.6em; line-height: 1.75; }
        #content li { margin: .2em 0; }
        #content li > ul, #content li > ol { margin-top: .1em; margin-bottom: .1em; }
        #content blockquote {
            margin: 1em 0; padding: 10px 16px; border-left: 4px solid #d0d7de;
            background: #f6f8fa; color: var(--text-muted); border-radius: 0 6px 6px 0;
        }
        #content blockquote p { margin: 0; }
        #content hr { border: none; border-top: 1px solid var(--border); margin: 1.5em 0; }
        #content table {
            border-collapse: collapse; width: 100%; margin: 1em 0;
            font-size: .875rem; overflow-x: auto; display: block;
        }
        #content th, #content td { border: 1px solid var(--border); padding: 7px 13px; text-align: left; }
        #content th { background: #f6f8fa; font-weight: 600; }
        #content tr:nth-child(even) { background: #fafbfc; }
        #content a { color: var(--accent); text-decoration: none; }
        #content a:hover { text-decoration: underline; color: var(--accent-hover); }

        /* 行内代码 */
        #content code:not(pre code) {
            background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px;
            padding: 1px 5px; font-size: .85em;
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
            color: #cf222e;
        }

        /* ===== 代码块容器（markdown-it highlight 生成的结构） ===== */
        #content .markdown-code-block { margin: 1em 0; }
        #content .markdown-code-block .markdown-code-header {
            background: #e8ecf0; color: #555; border-radius: 8px 8px 0 0;
            padding: 4px 12px; font-size: .78rem;
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
            clear: both; position: relative;
        }
        #content .markdown-code-block .markdown-header-actions { float: right; }
        #content .markdown-code-block .markdown-header-actions > * { margin-left: 8px; cursor: pointer; }
        #content .markdown-code-block .markdown-header-actions > *:hover { color: var(--accent); }
        #content .markdown-code-block .markdown-code-body {
            margin: 0; border-radius: 0 0 8px 8px; border: 1px solid var(--border);
            border-top: none; overflow: hidden; background: #f6f8fa; position: relative;
        }
        #content .markdown-code-block pre.hljs {
            margin: 0; padding: 14px 16px; overflow-x: auto; overflow-y: hidden;
            background: transparent; font-size: .83rem;
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
            line-height: 1.6; border: none;
        }
        #content .markdown-code-block pre.hljs code {
            display: block; white-space: pre; color: inherit; background: transparent;
        }

        /* ===== 代码行号 ===== */
        .code-line { display: inline-block; min-width: 100%; }
        .code-line:hover { background: rgba(9,105,218,.05); }
        .line-num {
            flex-shrink: 0; width: 44px; min-width: 44px;
            padding: 0 10px 0 0; text-align: right;
            color: #9ea7b3; font-size: .8rem; user-select: none;
            border-right: 1px solid #e1e4e8; margin-right: 14px; line-height: 1.6;
        }
        .line-content { flex: 1; white-space: pre; line-height: 1.6; }
        .hljs-line-wrapper { display: block; padding: 14px 16px 14px 0; }

        /* ===== 非 md 文件提示 ===== */
        .non-md-notice {
            background: #fff8c5; border: 1px solid #d4a72c; border-radius: 8px;
            padding: 16px 20px; margin: 1em 0; font-size: .88rem; color: #633c01;
        }

        /* ===== 媒体文件包装器 ===== */
        .media-wrapper {
            margin: 1em 0; border: 1px solid var(--border); border-radius: 8px;
            overflow: hidden; background: var(--surface);
        }
        .media-label {
            padding: 8px 12px; font-size: 0.85rem; color: var(--text-muted);
            background: var(--code-bg); border-bottom: 1px solid var(--border);
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .media-wrapper img, .media-wrapper video, .media-wrapper audio { display: block; width: 100%; }
        .media-wrapper img, .media-wrapper video { max-width: 100%; height: auto; max-height: calc(100vh - 160px); }
        .media-wrapper audio { padding: 12px; background: var(--surface); }

        /* ===== 页面背景图片 ===== */
        #page-background {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-size: cover; background-position: center;
            background-repeat: no-repeat; z-index: -1; pointer-events: none;
        }

        /* ===== 标题搜索框 ===== */
        #toc-search-wrap {
            padding: 7px 10px 6px; border-bottom: 1px solid var(--border); flex-shrink: 0; position: relative;
        }
        #toc-search {
            display: block; width: 100%; padding: 5px 26px 5px 8px;
            border: 1px solid var(--border); border-radius: 6px;
            font-size: 0.79rem; font-family: inherit;
            background: var(--surface); color: var(--text); outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        #toc-search:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(9,105,218,0.14); }
        #toc-search::placeholder { color: var(--text-muted); }
        #toc-search-clear {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer; color: var(--text-muted);
            font-size: 12px; line-height: 1; padding: 2px 4px; border-radius: 3px; display: none;
        }
        #toc-search-clear:hover { color: var(--text); background: var(--border); }
        #toc-search-clear.visible { display: block; }
        #toc-no-match { display: none; padding: 10px 14px; font-size: 0.78rem; color: var(--text-muted); }

        /* ===== Logo 点击切换 ===== */
        #app-logo { cursor: pointer; user-select: none; }
        #app-logo:hover { opacity: 0.82; }

        /* ===== 侧边栏遮罩（移动端） ===== */
        #sidebar-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.32); z-index: 55;
        }

        /* ===== 深色主题 ===== */
        body.dark {
            --bg: #0d1117aa; --surface: #161b2277; --border: #30363d;
            --text: #e6edf3; --text-muted: #7d8590; --accent: #58a6ff;
            --accent-hover: #79c0ff; --code-bg: #1c2128aa; --sidebar-bg: #13161ddd;
            --toc-active: #58a6ff; --scrollbar: #30363d; color-scheme: dark;
        }
        body.dark #content th { background: #21262d; }
        body.dark #content tr:nth-child(even) { background: #1c2128; }
        body.dark #content blockquote { background: #1c2128; border-left-color: #30363d; }
        body.dark #content code:not(pre code) { color: #ff7b72; background: #1c2128; border-color: #30363d; }
        body.dark .markdown-code-block .markdown-code-header { background: #2d333b; color: #adbac7; }
        body.dark .markdown-code-block .markdown-code-body { background: #1c2128; border-color: #30363d; }
        body.dark .line-num { color: #6e7681; border-right-color: #30363d; }
        body.dark .non-md-notice { background: #1b1f24; border-color: #30363d; color: #7d8590; }
        body.dark #error-msg { color: #ff7b72; }
        body.dark #top-bar { box-shadow: 0 1px 4px rgba(0,0,0,.3); }
        body.dark .media-wrapper { background: var(--surface); border-color: var(--border); }
        body.dark .media-label { background: #1c2128; border-bottom-color: var(--border); }
        body.dark .media-wrapper audio { background: var(--surface); }
        body.dark .mermaid-code-block { background: #1c2128; }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            #sidebar { width: 220px; }
            #content { padding: 20px 18px 60px; }
        }
        @media (max-width: 580px) {
            #sidebar {
                position: fixed; top: var(--header-height); left: 0; bottom: 0;
                width: var(--sidebar-width) !important; transform: translateX(-100%);
                transition: transform 0.25s ease; z-index: 60;
                box-shadow: 3px 0 16px rgba(0,0,0,0.18);
            }
            body.sidebar-open #sidebar { transform: translateX(0); }
            body.sidebar-open #sidebar-overlay { display: block; background: rgba(0,0,0,0.8); }
            #content { padding: 16px 14px 60px; }
            #print-page { display: none; }
        }
    </style>
</head>

<div id="top-bar">

        <span class="sep">/</span>

    mermaid.initialize({ startOnLoad: false });

    gsap.registerPlugin(CSSRulePlugin, CustomEase, Draggable, EaselPlugin,
        EasePack, Flip, MotionPathPlugin, Observer, PixiPlugin,

<!-- markdown-setup.js 提供 renderMarkdown() -->
<script src="./assets/markdown-setup.js"></script>

<script>
/* ===================================================
   配置加载
   =================================================== */
const DEFAULT_CONFIG = { title: 'Docs', index: 'readme.md', background: '' };
let appConfig = Object.assign({}, DEFAULT_CONFIG);

/* ===================================================
   工具函数
   =================================================== */
function getFileFromHash() {
    const hash = decodeURIComponent(location.hash);
    if (!hash || hash === '#' || hash === '#/') return appConfig.index || DEFAULT_CONFIG.index || 'readme.md';
    const raw = hash.startsWith('#') ? hash.slice(1) : hash;
    return raw.replace(/^\.\//, '');
}

function resolvePath(basePath, relativePath) {
    if (/^https?:\/\//i.test(relativePath)) return relativePath;
    if (relativePath.startsWith('/')) return relativePath;
    const baseDir = basePath.includes('/') ? basePath.replace(/\/[^/]+$/, '') : '';
    const parts = (baseDir ? baseDir + '/' + relativePath : relativePath).split('/');
    const resolved = [];
    for (const part of parts) {
        if (part === '..') resolved.pop();
        else if (part !== '.') resolved.push(part);
    }
    return resolved.join('/');
}

function getFileBaseName(path) {
    if (!path || path === '') return '';
    const cleanPath = path.split('?')[0];
    let idx = cleanPath.lastIndexOf('/');
    return idx >= 0 ? cleanPath.substring(idx + 1) : cleanPath;
}

function getFileSuffix(path) {
    if (!path || path === '') return '';
    path = getFileBaseName(path);
    let idx = path.lastIndexOf('.');
    return idx >= 0 ? path.substring(idx) : '';
}

function isMdFile(path) { return getFileSuffix(path).toLowerCase() === '.md'; }

function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function hasNoPreviewParam(href) {
    if (!href) return false;
    let idx = href.indexOf('?');
    if (idx < 0) return false;
    href = href.substring(idx + 1);
    idx = href.indexOf('#');
    if (idx >= 0) href = href.substring(0, idx);
    let urlParams = new URLSearchParams(href);
    let val = urlParams.get('_preview');
    return val === 'no' || val === '0' || val === 'false';
}

const TEXT_FILE_SUFFIX_LANGS = {
    '.txt':'','.py':'python','.java':'java','.sql':'sql','.xml':'xml','.dtd':'xml',
    '.yaml':'yaml','.yml':'yaml','.json':'json','.js':'javascript','.jsp':'xml',
    '.properties':'properties','.ini':'ini','.conf':'ini','.cnf':'ini','.config':'ini',
    '.sh':'shell','.bat':'shell','.cmd':'shell','.c':'cpp','.h':'cpp','.cpp':'cpp',
    '.hpp':'cpp','.cs':'csharp','.css':'css','.sass':'css','.less':'css','.go':'go',
    '.kt':'kotlin','.kts':'kotlin','.lua':'lua','.perl':'perl','.scala':'scala',
    '.ts':'typescript','.vbs':'vbscript','.log':'accesslog','.gitignore':'',
    '.gitattributes':'','.bnf':'','.g4':'','.vue':'xml','.csv':'','.lock':'',
    '.dockerfile':'dockerfile','.groovy':'groovy','.dtd':'xml','.nginx':'nginx',
    '.makefile':'makefile','.rb':'ruby','.rs':'rust','.swift':'swift','.r':'r',
    '.m':'matlab','.pl':'perl','.php':'php','.http':'http'
};
const TEXT_FILE_NAME_LANGS = {
    'dockerfile':'dockerfile','makefile':'makefile','nginx.conf':'nginx','license':'',
    'jenkinsfile':'groovy'
};

function isTextFile(path) {
    const name = getFileBaseName(path).toLowerCase();
    if (name in TEXT_FILE_NAME_LANGS) return true;
    const ext = getFileSuffix(path).toLowerCase();
    return ext in TEXT_FILE_SUFFIX_LANGS;
}

function getFileLang(path) {
    const name = getFileBaseName(path).toLowerCase();
    let lang = TEXT_FILE_NAME_LANGS[name];
    if (lang) return lang;
    const ext = getFileSuffix(path).toLowerCase();
    lang = TEXT_FILE_SUFFIX_LANGS[ext];
    return lang || '';
}

function isVideoFile(path) { return ['.mp4','.webm','.mov','.mkv','.avi','.flv'].includes(getFileSuffix(path).toLowerCase()); }
function isAudioFile(path) { return ['.mp3','.wav','.ogg','.aac','.flac','.m4a','.wma'].includes(getFileSuffix(path).toLowerCase()); }
function isPdfFile(path) { return getFileSuffix(path).toLowerCase() === '.pdf'; }

function headingId(text) {
    return text.toLowerCase().replace(/<[^>]+>/g,'').replace(/[^\w\u4e00-\u9fa5\- ]/g,'').trim().replace(/\s+/g,'-');
}

let currentFilePath = 'readme.md';

/* ===================================================
   后处理：标题 ID 注入
   =================================================== */
function injectHeadingIds(container) {
    container.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(h => {
        if (!h.id) {
            h.id = headingId(h.textContent);
        }
    });
}

/* ===================================================
   后处理：代码块行号注入
   =================================================== */
function injectLineNumbers(container) {
    container.querySelectorAll('.markdown-code-body > pre.hljs > code').forEach(codeEl => {
        const rawHtml = codeEl.innerHTML;
        const lines = rawHtml.split('\n');
        if (lines.length > 0 && lines[lines.length - 1].trim() === '') lines.pop();
        const totalLines = lines.length;
        const numWidth = String(totalLines).length;
        const wrapped = lines.map((lineHtml, i) => {
            const num = String(i + 1).padStart(numWidth, ' ');
            return '<span class="code-line"><span class="line-num">' + num + '</span><span class="line-content">' + lineHtml + '</span></span>';
        }).join('\n');
        codeEl.innerHTML = '<span class="hljs-line-wrapper">' + wrapped + '</span>';
    });
}

/* ===================================================
   后处理：链接处理（md文件跳转、媒体渲染、PDF预览）
   =================================================== */
function postProcessLinks(container) {
    container.querySelectorAll('a[href]').forEach(a => {
        const href = a.getAttribute('href');
        if (!href) return;
        const text = a.textContent;

        // 外链处理
        if (/^https?:\/\//i.test(href)) {
            // 视频
            if (isVideoFile(href) && !hasNoPreviewParam(href)) {
                const fn = getFileBaseName(href);
                const dn = (fn === text ? fn : (text + '[' + fn + ']')) || fn || text;
                a.outerHTML = '<div class="media-wrapper"><div class="media-label"><a href="'+href+'" target="_blank">&#127925; '+escapeHtml(dn)+'</a></div><video src="'+href+'" controls style="max-width:100%;" title="'+(a.title||'')+'">'+text+'</video></div>';
                return;
            }
            // 音频
            if (isAudioFile(href) && !hasNoPreviewParam(href)) {
                const fn = getFileBaseName(href);
                const dn = (fn === text ? fn : (text + '[' + fn + ']')) || fn || text;
                a.outerHTML = '<div class="media-wrapper"><div class="media-label"><a href="'+href+'" target="_blank">&#127925; '+escapeHtml(dn)+'</a></div><audio src="'+href+'" controls title="'+(a.title||'')+'">'+text+'</audio></div>';
                return;
            }
            // PDF
            if (isPdfFile(href) && !hasNoPreviewParam(href)) {
                const fn = getFileBaseName(href);
                const dn = (fn === text ? fn : (text + '[' + fn + ']')) || fn || text;
                a.outerHTML = '<div class="media-wrapper"><div class="media-label"><a href="'+href+'" target="_blank">&#127925; '+escapeHtml(dn)+'</a></div><object style="width:100%;" width="100%" height="'+(window.innerHeight-160)+'px" data="'+href+'#navpanes=0&amp;toolbar=0" type="application/pdf"><div style="width:100%;text-align:center;margin:5px;">您的浏览器不支持预览PDF！请点击查看</div></object></div>';
                return;
            }
            a.setAttribute('target', '_blank');
            a.setAttribute('rel', 'noopener');
            return;
        }

        // 相对路径
        const resolved = resolvePath(currentFilePath, href);

        // 视频/音频/PDF（相对路径）
        if (isVideoFile(resolved) && !hasNoPreviewParam(href)) {
            const fn = getFileBaseName(href);
            const dn = (fn === text ? fn : (text + '[' + fn + ']')) || fn || text;
            const rHref = resolved;
            a.outerHTML = '<div class="media-wrapper"><div class="media-label"><a href="'+rHref+'" target="_blank">&#127925; '+escapeHtml(dn)+'</a></div><video src="'+rHref+'" controls style="max-width:100%;" title="'+(a.title||'')+'">'+text+'</video></div>';
            return;
        }
        if (isAudioFile(resolved) && !hasNoPreviewParam(href)) {
            const fn = getFileBaseName(href);
            const dn = (fn === text ? fn : (text + '[' + fn + ']')) || fn || text;
            const rHref = resolved;
            a.outerHTML = '<div class="media-wrapper"><div class="media-label"><a href="'+rHref+'" target="_blank">&#127925; '+escapeHtml(dn)+'</a></div><audio src="'+rHref+'" controls title="'+(a.title||'')+'">'+text+'</audio></div>';
            return;
        }
        if (isPdfFile(resolved) && !hasNoPreviewParam(href)) {
            const fn = getFileBaseName(href);
            const dn = (fn === text ? fn : (text + '[' + fn + ']')) || fn || text;
            const rHref = resolved;
            a.outerHTML = '<div class="media-wrapper"><div class="media-label"><a href="'+rHref+'" target="_blank">&#127925; '+escapeHtml(dn)+'</a></div><object style="width:100%;" width="100%" height="'+(window.innerHeight-160)+'px" data="'+rHref+'#navpanes=0&amp;toolbar=0" type="application/pdf"><div style="width:100%;text-align:center;margin:5px;">您的浏览器不支持预览PDF！请点击查看</div></object></div>';
            return;
        }

        // md 文件或文本文件：拦截为站内导航
        if (isMdFile(resolved) || isTextFile(resolved)) {
            a.setAttribute('data-md-link', resolved);
            a.setAttribute('href', '#' + encodeURIComponent(resolved));
        }
    });
}

/* ===================================================
   后处理：图片处理（相对路径解析 + 媒体包装）
   =================================================== */
function postProcessImages(container) {
    container.querySelectorAll('img').forEach(img => {
        let src = img.getAttribute('src');
        if (!src) return;
        if (!(/^https?:\/\//i.test(src))) {
            src = resolvePath(currentFilePath, src);
            img.setAttribute('src', src);
        }
        if (hasNoPreviewParam(src)) {
            const fn = getFileBaseName(src);
            const alt = img.getAttribute('alt') || fn;
            img.outerHTML = '<a href="'+src+'" target="_blank">&#127925; '+escapeHtml(alt)+'</a>';
            return;
        }
        const fn = getFileBaseName(src);
        const alt = img.getAttribute('alt') || fn;
        const wrapper = document.createElement('div');
        wrapper.className = 'media-wrapper';
        wrapper.innerHTML = '<div class="media-label"><a href="'+src+'" target="_blank">&#127925; '+escapeHtml(alt)+'</a></div>';
        const newImg = img.cloneNode(true);
        newImg.style.cssText = 'max-width:100%;height:auto;display:block;';
        wrapper.appendChild(newImg);
        img.replaceWith(wrapper);
    });
}

/* ===================================================
   目录生成
   =================================================== */
function buildToc(container) {
    const headings = container.querySelectorAll('h1,h2,h3,h4,h5,h6');
    const tocEl = document.getElementById('toc-container');
    if (headings.length === 0) {
        tocEl.innerHTML = '<div style="padding:16px 14px;color:var(--text-muted);font-size:.8rem;">本文档无标题目录</div>';
        return;
    }
    const items = [];
    headings.forEach(h => {
        const level = parseInt(h.tagName[1]);
        const text = h.textContent.trim().replace('<','&lt;').replace('>','&gt;');
        const id = h.id || headingId(text);
        h.id = id;
        items.push({ level, text, id });
    });
    tocEl.innerHTML = items.map(item =>
        '<a class="toc-item h'+item.level+'" href="#'+encodeURIComponent(item.id)+'" data-anchor="'+item.id+'" title="'+item.text+'">'+item.text+'</a>'
    ).join('');

    tocEl.querySelectorAll('.toc-item[data-anchor]').forEach(a => {
        a.addEventListener('click', e => {
            e.preventDefault();
            const target = document.getElementById(a.dataset.anchor);
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            closeSidebarOnMobile();
        });
    });
    setupScrollSpy(items.map(i => i.id));
}

/* ===================================================
   滚动监听 - 高亮目录当前项
   =================================================== */
let scrollSpyObserver = null;
function setupScrollSpy(ids) {
    if (scrollSpyObserver) scrollSpyObserver.disconnect();
    const tocEl = document.getElementById('toc-container');
    const contentWrap = document.getElementById('content-wrap');
    const headerOffset = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--header-height')) || 52;
    scrollSpyObserver = new IntersectionObserver(entries => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const id = entry.target.id;
                tocEl.querySelectorAll('.toc-item').forEach(a => {
                    a.classList.toggle('active', a.dataset.anchor === id);
                });
                const active = tocEl.querySelector('.toc-item.active');
                if (active) active.scrollIntoView({ block: 'nearest' });
            }
        });
    }, { root: contentWrap, rootMargin: '-'+headerOffset+'px 0px -70% 0px', threshold: 0 });
    ids.forEach(id => { const el = document.getElementById(id); if (el) scrollSpyObserver.observe(el); });
}

/* ===================================================
   加载并渲染文件
   =================================================== */
async function loadFile(filePath) {
    filePath = filePath.replace(/^\.\//, '').replace(/^#/, '');
    currentFilePath = filePath;
    document.getElementById('crumb-file').textContent = filePath;
    document.title = filePath + ' — ' + appConfig.title;

    const content = document.getElementById('content');
    content.innerHTML = '<div id="loading"><div class="spinner"></div><span>正在加载 '+escapeHtml(filePath)+' ...</span></div>';
    document.getElementById('toc-container').innerHTML =
        '<div style="padding:16px 14px;color:var(--text-muted);font-size:.8rem;">加载中...</div>' +
        '<div id="toc-no-match">未找到匹配的标题</div>';
    resetTocSearch();
    document.getElementById('content-wrap').scrollTop = 0;

    if (!isMdFile(filePath)) {
        if (isTextFile(filePath)) {
            try {
                const resp = await fetch(filePath + '?t=' + Date.now());
                if (!resp.ok) throw new Error('HTTP ' + resp.status + ': ' + resp.statusText);
                const textContent = await resp.text();
                const lang = getFileLang(filePath);
                const validLang = lang && hljs.getLanguage(lang) ? lang : 'text';
                const fileName = filePath.split('/').pop();
                const fid = headingId(fileName);
                // 使用 markdown-it 渲染为代码块格式
                const mdContent = '```' + validLang + '\n' + textContent + '\n```';
                content.innerHTML = '<h1 id="'+fid+'">'+escapeHtml(fileName)+'</h1>' + renderMarkdown(mdContent);
                injectLineNumbers(content);
                buildToc(content);
            } catch (err) {
                content.innerHTML = '<div id="error-msg"><div style="font-size:2rem">&#10060;</div><strong>加载失败：'+escapeHtml(err.message)+'</strong><div style="font-size:.8rem;color:var(--text-muted)">文件路径: <code>'+escapeHtml(filePath)+'</code></div></div>';
                document.getElementById('toc-container').innerHTML = '<div style="padding:16px 14px;color:var(--text-muted);font-size:.8rem;">加载失败</div>';
            }
            return;
        }
        content.innerHTML = '<div class="non-md-notice"><strong>&#9432; 提示：</strong>该文件 <code>'+escapeHtml(filePath)+'</code> 不是 Markdown 文件，无法在此渲染。<br/><a href="'+filePath+'" target="_blank">点击此处在新窗口中打开</a></div>';
        document.getElementById('toc-container').innerHTML = '<div style="padding:16px 14px;color:var(--text-muted);font-size:.8rem;">-</div>';
        return;
    }

    try {
        const resp = await fetch(filePath + '?t=' + Date.now());
        if (!resp.ok) throw new Error('HTTP ' + resp.status + ': ' + resp.statusText);
        const mdText = await resp.text();
        renderMdPage(mdText, content);
    } catch (err) {
        content.innerHTML = '<div id="error-msg"><div style="font-size:2rem">&#10060;</div><strong>加载失败：'+escapeHtml(err.message)+'</strong><div style="font-size:.8rem;color:var(--text-muted)">文件路径: <code>'+escapeHtml(filePath)+'</code><br/>请确保文件存在，且静态文件服务已正确配置。</div></div>';
        document.getElementById('toc-container').innerHTML = '<div style="padding:16px 14px;color:var(--text-muted);font-size:.8rem;">加载失败</div>';
    }
}

function renderMdPage(mdText, container) {
    container.innerHTML = renderMarkdown(mdText);
    injectHeadingIds(container);
    injectLineNumbers(container);
    postProcessImages(container);
    postProcessLinks(container);
    buildToc(container);
    bindMdLinks(container);
}

/* ===================================================
   绑定 md 文件内部链接的跳转行为
   =================================================== */
function bindMdLinks(container) {
    container.querySelectorAll('a[data-md-link]').forEach(a => {
        a.addEventListener('click', e => {
            e.preventDefault();
            navigateTo(a.dataset.mdLink);
            closeSidebarOnMobile();
        });
    });
}

/* ===================================================
   侧边栏切换
   =================================================== */
function closeSidebarOnMobile() {
    if (window.innerWidth <= 580) document.body.classList.remove('sidebar-open');
}

document.getElementById('app-logo').addEventListener('click', () => {
    if (window.innerWidth <= 580) document.body.classList.toggle('sidebar-open');
    else document.body.classList.toggle('sidebar-collapsed');
});

document.getElementById('sidebar-overlay').addEventListener('click', () => {
    document.body.classList.remove('sidebar-open');
});

window.addEventListener('resize', () => {
    if (window.innerWidth > 580) document.body.classList.remove('sidebar-open');
    else document.body.classList.remove('sidebar-collapsed');
});

/* ===================================================
   TOC 搜索过滤
   =================================================== */
const _tocSearch = document.getElementById('toc-search');
const _tocSearchClear = document.getElementById('toc-search-clear');

function filterToc(query) {
    const q = query.trim().toLowerCase();
    const items = document.querySelectorAll('#toc-container .toc-item');
    let matchCount = 0;
    items.forEach(item => {
        const hit = !q || item.textContent.trim().toLowerCase().includes(q);
        item.style.display = hit ? '' : 'none';
        if (hit) matchCount++;
    });
    const noMatch = document.getElementById('toc-no-match');
    if (noMatch) noMatch.style.display = (q && matchCount === 0) ? 'block' : 'none';
    _tocSearchClear.classList.toggle('visible', q.length > 0);
}

function resetTocSearch() {
    _tocSearch.value = '';
    _tocSearchClear.classList.remove('visible');
    const noMatch = document.getElementById('toc-no-match');
    if (noMatch) noMatch.style.display = 'none';
}

_tocSearch.addEventListener('input', () => filterToc(_tocSearch.value));
_tocSearchClear.addEventListener('click', () => { _tocSearch.value = ''; filterToc(''); _tocSearch.focus(); });

/* ===================================================
   Manifest 配置加载
   =================================================== */
async function loadManifest() {
    try {
        const resp = await fetch('manifest.json?t=' + Date.now());
        if (!resp.ok) throw new Error('not found');
        const data = await resp.json();
        if (data.title) appConfig.title = String(data.title);
        if (data.index) appConfig.index = String(data.index).replace(/^\.\//, '');
        if (data.background) appConfig.background = String(data.background);
    } catch (e) { /* 保持默认配置 */ }
    document.getElementById('app-logo').textContent = '\uD83D\uDCC4 ' + appConfig.title;
    document.querySelector('head title').textContent = appConfig.title;
    applyBackground();
}

function applyBackground() {
    if (!appConfig.background) return;
    let bgEl = document.getElementById('page-background');
    if (!bgEl) {
        bgEl = document.createElement('div');
        bgEl.id = 'page-background';
        document.body.insertBefore(bgEl, document.body.firstChild);
    }
    bgEl.style.backgroundImage = 'url(' + appConfig.background + ')';
}

/* ===================================================
   导航 & 路由
   =================================================== */
function navigateTo(filePath) {
    const clean = filePath.replace(/^\.\//, '').replace(/^#/, '');
    const encoded = encodeURIComponent(clean);
    const current = decodeURIComponent((location.hash || '#').slice(1));
    if (current !== clean) location.hash = '#' + encoded;
    else loadFile(clean);
}

/* ===================================================
   主题切换
   =================================================== */
const HLJS_LIGHT = './lib/highlight.js/11.11.1/styles/github.min.css';
const HLJS_DARK = './lib/highlight.js/11.11.1/styles/github-dark.min.css';

function applyTheme(isDark) {
    document.body.classList.toggle('dark', isDark);
    document.getElementById('hljs-css').href = isDark ? HLJS_DARK : HLJS_LIGHT;
    document.getElementById('theme-btn').textContent = isDark ? '\u2600\uFE0F' : '\uD83C\uDF19';
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
}

document.getElementById('theme-btn').addEventListener('click', () => {
    applyTheme(!document.body.classList.contains('dark'));
});

(function initTheme() {
    const saved = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(saved ? saved === 'dark' : prefersDark);
})();

/* ===================================================
   背景图片切换
   =================================================== */
function closeBackgroundImage() {
    const dom = document.getElementById('page-background');
    if (dom) dom.style.display = 'none';
}

document.getElementById('bgimg-btn').addEventListener('click', () => {
    const dom = document.getElementById('page-background');
    if (!dom) return;
    dom.style.display = dom.style.display === 'none' ? 'unset' : 'none';
});

/* ===================================================
   打印
   =================================================== */
function printPage() {
    closeBackgroundImage();
    document.getElementById('top-bar').style.display = 'none';
    document.getElementById('sidebar-overlay').style.display = 'none';
    document.getElementById('sidebar').style.display = 'none';
    document.body.style.height = 'auto';
    document.body.style.overflow = 'auto';
    window.print();
}
document.getElementById('print-page').addEventListener('click', () => printPage());

/* ===================================================
   代码块复制/保存（静态站点版，不依赖 Element UI）
   =================================================== */
function copy2clipboard(text) {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.select();
    try { document.execCommand('copy'); } catch (err) {}
    document.body.removeChild(textarea);
}

window.copy2clipboard = copy2clipboard;

window.onCopyMarkdownCodeBlock = function(event, lang) {
    getMarkdownCodeBlockText(event).then(text => {
        copy2clipboard(text);
    });
};

window.onSaveMarkdownCodeBlock = function(event, lang) {
    getMarkdownCodeBlockText(event).then(text => {
        const blob = new Blob([text], { type: 'plain/text;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = (lang || 'text') + '_' + new Date().getTime() + '.txt';
        link.click();
        URL.revokeObjectURL(url);
    });
};

/* ===================================================
   初始化 & 路由
   =================================================== */
window.addEventListener('hashchange', () => loadFile(getFileFromHash()));

(async function init() {
    await loadManifest();
    const hashFile = getFileFromHash();
    const fileToLoad = (location.hash && location.hash !== '#') ? hashFile : appConfig.index;
    loadFile(fileToLoad);
})();
</script>
