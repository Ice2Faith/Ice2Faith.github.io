<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg10" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eaf0f7"/>
    </linearGradient>
    <marker id="ar10" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#64748b"/></marker>
    <marker id="ar10b" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#1f7a5a"/></marker>
  </defs>
  <rect width="1240" height="820" fill="url(#bg10)"/>
  <text x="620" y="42" text-anchor="middle" font-size="29" font-weight="700" fill="#1f2d3d">聚合与依赖治理 · 拓扑全景</text>
  <text x="620" y="70" text-anchor="middle" font-size="14" fill="#64748b">根坐标 i2f.turbo · 单向依赖自底向上 · 聚合包(*-all)整合各组 · 三方依赖以 provided/optional 解耦</text>

  <!-- ===== Left: vertical dependency flow ===== -->
  <text x="40" y="108" font-size="16" font-weight="700" fill="#1f2d3d">① 分层依赖流向（自底向上，禁止反向）</text>
  <g font-size="13">
    <rect x="40" y="124" width="360" height="72" rx="10" fill="#e8f0f8" stroke="#2e6da4"/>
    <text x="60" y="150" font-weight="700" fill="#1e4e79">i2f-jdk</text>
    <text x="60" y="170" fill="#475569">纯 JDK（支持 JDK8）· 打包含全部依赖(fat)</text>
    <text x="60" y="188" fill="#94a3b8">152 子模块 / 181,876 行</text>

    <rect x="40" y="216" width="360" height="60" rx="10" fill="#eef4ff" stroke="#8a63d2"/>
    <text x="60" y="240" font-weight="700" fill="#5b3a94">i2f-jdk-ext</text>
    <text x="60" y="260" fill="#475569">JRE 扩展包（javax / jakarta）</text>

    <rect x="40" y="296" width="360" height="72" rx="10" fill="#e7f6ee" stroke="#2fa572"/>
    <text x="60" y="322" font-weight="700" fill="#1f7a5a">i2f-extension</text>
    <text x="60" y="342" fill="#475569">三方 Jar 二次封装 · 依赖 jdk + 三方库</text>
    <text x="60" y="360" fill="#94a3b8">86 子模块 · 三方依赖 provided 不打包</text>

    <rect x="40" y="388" width="360" height="56" rx="10" fill="#f1ecfb" stroke="#8a63d2"/>
    <text x="60" y="410" font-weight="700" fill="#5b3a94">i2f-spring</text>
    <text x="60" y="430" fill="#475569">Spring Framework 基础封装（无 Boot 装配）</text>

    <rect x="40" y="464" width="172" height="60" rx="10" fill="#f1ecfb" stroke="#8a63d2"/>
    <text x="56" y="488" font-weight="700" fill="#5b3a94">i2f-springboot</text>
    <text x="56" y="508" fill="#475569">自动装配 Starter · 37</text>

    <rect x="228" y="464" width="172" height="60" rx="10" fill="#f1ecfb" stroke="#8a63d2"/>
    <text x="244" y="488" font-weight="700" fill="#5b3a94">i2f-springcloud</text>
    <text x="244" y="508" fill="#475569">微服务治理 Starter · 23</text>

    <rect x="40" y="544" width="360" height="52" rx="10" fill="#fbf1e6" stroke="#d09a4a"/>
    <text x="60" y="566" font-weight="700" fill="#8a5a1f">i2f-tools / i2f-spring-ai</text>
    <text x="60" y="586" fill="#475569">工具集 / AI（JDK17 独立 reactor，不参与 jdk8 主链）</text>

    <!-- flow arrows -->
    <line x1="220" y1="196" x2="220" y2="216" stroke="#64748b" stroke-width="2" marker-end="url(#ar10)"/>
    <line x1="220" y1="276" x2="220" y2="296" stroke="#64748b" stroke-width="2" marker-end="url(#ar10)"/>
    <line x1="220" y1="368" x2="220" y2="388" stroke="#64748b" stroke-width="2" marker-end="url(#ar10)"/>
    <line x1="220" y1="444" x2="220" y2="464" stroke="#64748b" stroke-width="2" marker-end="url(#ar10)"/>
    <line x1="220" y1="524" x2="220" y2="544" stroke="#64748b" stroke-width="2" marker-end="url(#ar10)"/>
  </g>

  <!-- ===== Right top: aggregators ===== -->
  <text x="470" y="108" font-size="16" font-weight="700" fill="#1f2d3d">② 聚合包 *-all（整合本组全部产物）</text>
  <g font-size="13">
    <rect x="470" y="124" width="730" height="104" rx="12" fill="#ffffff" stroke="#cfd8e3"/>
    <g text-anchor="middle">
      <rect x="500" y="150" width="150" height="56" rx="8" fill="#e8f0f8" stroke="#2e6da4"/><text x="575" y="176" font-weight="700" fill="#1e4e79">i2f-jdk-all</text><text x="575" y="194" fill="#64748b">聚合 jdk 152 件</text>
      <rect x="680" y="150" width="150" height="56" rx="8" fill="#eef4ff" stroke="#8a63d2"/><text x="755" y="176" font-weight="700" fill="#5b3a94">i2f-jdk-ext-all</text><text x="755" y="194" fill="#64748b">聚合 jdk-ext</text>
      <rect x="860" y="150" width="150" height="56" rx="8" fill="#e7f6ee" stroke="#2fa572"/><text x="935" y="176" font-weight="700" fill="#1f7a5a">i2f-extension-all</text><text x="935" y="194" fill="#64748b">聚合 extension 86 件</text>
      <rect x="1040" y="150" width="130" height="56" rx="8" fill="#f1ecfb" stroke="#8a63d2"/><text x="1105" y="176" font-weight="700" fill="#5b3a94">i2f-spring-all</text><text x="1105" y="194" fill="#64748b">聚合 spring</text>
    </g>
  </g>

  <!-- ===== Right mid: std/impl contract ===== -->
  <text x="470" y="268" font-size="16" font-weight="700" fill="#1f2d3d">③ std / impl 契约分层（单向，impl 依赖 std）</text>
  <g font-size="13">
    <rect x="470" y="284" width="730" height="120" rx="12" fill="#ffffff" stroke="#cfd8e3"/>
    <rect x="500" y="312" width="180" height="64" rx="8" fill="#f3eefe" stroke="#8a63d2"/>
    <text x="590" y="338" text-anchor="middle" font-weight="700" fill="#5b3a94">{功能}-std</text>
    <text x="590" y="358" text-anchor="middle" fill="#64748b">定义接口契约 · 全仓 19 个</text>
    <line x1="682" y1="344" x2="742" y2="344" stroke="#1f7a5a" stroke-width="2.5" marker-end="url(#ar10b)"/>
    <text x="712" y="336" text-anchor="middle" fill="#1f7a5a" font-size="11">implements</text>
    <rect x="746" y="312" width="180" height="64" rx="8" fill="#e7f6ee" stroke="#2fa572"/>
    <text x="836" y="338" text-anchor="middle" font-weight="700" fill="#1f7a5a">{功能}-impl</text>
    <text x="836" y="358" text-anchor="middle" fill="#64748b">提供默认实现 · 全仓 12 个</text>
    <line x1="928" y1="344" x2="988" y2="344" stroke="#1f7a5a" stroke-width="2.5" marker-end="url(#ar10b)"/>
    <rect x="992" y="312" width="180" height="64" rx="8" fill="#fff7ed" stroke="#f0c890"/>
    <text x="1082" y="338" text-anchor="middle" font-weight="700" fill="#8a5a1f">{功能}-api / 多实现</text>
    <text x="1082" y="358" text-anchor="middle" fill="#64748b">一契约多引擎 · 如 redis-api</text>
    <text x="500" y="392" fill="#94a3b8">价值：消费方仅依赖 std 契约即可换实现；clock-std↔clock-impl、redis-api↔(jedis/spring-redis) 为典型样例。</text>
  </g>

  <!-- ===== Right bottom: provided/optional governance ===== -->
  <text x="470" y="440" font-size="16" font-weight="700" fill="#1f2d3d">④ 依赖作用域治理（i2f-extension 实测）</text>
  <g font-size="13">
    <rect x="470" y="456" width="730" height="150" rx="12" fill="#ffffff" stroke="#cfd8e3"/>
    <!-- donut-ish bars -->
    <text x="500" y="486" font-weight="700" fill="#1f7a5a">&lt;scope&gt;provided&lt;/scope&gt; = 159 处</text>
    <rect x="500" y="494" width="560" height="18" rx="4" fill="#e7f6ee"/>
    <rect x="500" y="494" width="560" height="18" rx="4" fill="#2fa572" opacity="0.75"/>
    <text x="508" y="508" fill="#ffffff" font-size="11">三方库编译期可见、运行期由宿主自备 → 避免 fat jar 冲突</text>

    <text x="500" y="538" font-weight="700" fill="#8a5a1f">&lt;optional&gt;true&lt;/optional&gt; = 76 处</text>
    <rect x="500" y="546" width="560" height="18" rx="4" fill="#fbf1e6"/>
    <rect x="500" y="546" width="268" height="18" rx="4" fill="#d09a4a" opacity="0.85"/>
    <text x="508" y="560" fill="#ffffff" font-size="11">不向下游传递 · 供可选特性按需触发</text>

    <text x="500" y="592" fill="#475569">版本统一：根 pom &lt;dependencyManagement&gt; 集中治理；部分扩展仍在模块内硬编码版本（如 jedis 3.8.0、fory-json 1.7.4）。</text>
  </g>

  <!-- footer -->
  <g font-size="12.5" fill="#64748b">
    <text x="40" y="640" font-size="15" font-weight="700" fill="#1f2d3d">治理要点</text>
    <text x="40" y="666">· 打包语义：jdk 系模块打 fat jar（含依赖）；extension 系仅打自身代码，三方依赖 provided 解耦，便于「按需搬移源码」。</text>
    <text x="40" y="690">· 反向依赖禁令：上层可依赖下层，下层绝不依赖上层；同层以 std 契约解耦，规避循环引用。</text>
    <text x="40" y="714">· 聚合边界：仅 jdk / jdk-ext / extension / spring 四组提供 *-all；tools / springboot / springcloud / spring-ai 无聚合包，按 Starter 独立引入。</text>
    <text x="40" y="738">· 独立构建：i2f-spring-ai 基于 JDK17，与 jdk8 主 reactor 物理隔离，度量图中单列。</text>
  </g>
</svg>
