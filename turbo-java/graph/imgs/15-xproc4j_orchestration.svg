<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg15" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfe"/><stop offset="1" stop-color="#e9eef6"/>
    </linearGradient>
    <marker id="ar15" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#475569"/></marker>
  </defs>
  <rect width="1240" height="820" fill="url(#bg15)"/>
  <text x="620" y="42" text-anchor="middle" font-size="29" font-weight="700" fill="#1f2d3d">XProc4J · XML 存储过程编排框架全景</text>
  <text x="620" y="70" text-anchor="middle" font-size="14" fill="#64748b">基于 XML 的 JDBC 存储过程编排 · 多语言脚本混编 · SQL 方言适配 / 动态数据源 / 事务 · 已完成 Oracle→国产库生产迁移</text>

  <!-- center module -->
  <g font-size="12.5">
    <rect x="420" y="96" width="400" height="92" rx="12" fill="#e7f6ee" stroke="#1f7a5a" stroke-width="2.5"/>
    <text x="620" y="128" text-anchor="middle" font-size="18" font-weight="700" fill="#166a4c">i2f-extension-xproc4j</text>
    <text x="620" y="152" text-anchor="middle" fill="#475569">XML 过程定义 · 解释执行引擎</text>
    <text x="620" y="172" text-anchor="middle" fill="#94a3b8">语法预检 · 脚本预热 · 依赖分析</text>
  </g>

  <!-- left: base + starter -->
  <text x="40" y="112" font-size="14" font-weight="700" fill="#1e4e79">依托基础</text>
  <g font-size="12.5">
    <rect x="40" y="122" width="350" height="62" rx="10" fill="#e8f0f8" stroke="#2e6da4"/>
    <text x="58" y="148" font-weight="700" fill="#1e4e79">i2f-jdk / i2f-jdbc-procedure</text>
    <text x="58" y="168" fill="#475569">存储过程抽象基座（契约）</text>
  </g>
  <text x="40" y="212" font-size="14" font-weight="700" fill="#5b3a94">Spring Boot 装配</text>
  <g font-size="12.5">
    <rect x="40" y="222" width="350" height="62" rx="10" fill="#f3eefe" stroke="#8a63d2"/>
    <text x="58" y="248" font-weight="700" fill="#5b3a94">springboot-xproc4j-starter</text>
    <text x="58" y="268" fill="#475569">自动装配 + 动态数据源接入</text>
  </g>
  <line x1="390" y1="153" x2="418" y2="140" stroke="#475569" stroke-width="1.8" marker-end="url(#ar15)"/>
  <line x1="390" y1="253" x2="418" y2="170" stroke="#475569" stroke-width="1.8" marker-end="url(#ar15)"/>

  <!-- right: capabilities -->
  <text x="850" y="112" font-size="14" font-weight="700" fill="#c2410c">核心能力矩阵</text>
  <g font-size="12.5">
    <rect x="850" y="122" width="350" height="162" rx="10" fill="#fff1e6" stroke="#f0a05a"/>
    <text x="870" y="146" fill="#7c2d12">· XML 存储过程定义与解析</text>
    <text x="870" y="170" fill="#7c2d12">· 多语言脚本混编执行（见下）</text>
    <text x="870" y="194" fill="#7c2d12">· SQL 方言适配（多数据库）</text>
    <text x="870" y="218" fill="#7c2d12">· 动态数据源路由</text>
    <text x="870" y="242" fill="#7c2d12">· 事务控制</text>
    <text x="870" y="266" fill="#7c2d12">· Java Caller（互调）</text>
    <text x="870" y="278" fill="#7c2d12">· 调试追踪</text>
  </g>
  <line x1="822" y1="142" x2="848" y2="150" stroke="#475569" stroke-width="1.8" marker-end="url(#ar15)"/>

  <!-- language mix band -->
  <text x="40" y="330" font-size="16" font-weight="700" fill="#1f2d3d">① 多语言脚本混编（ContextFunctions extends AllMixins 提供内建函数库）</text>
  <g font-size="12.5">
    <rect x="40" y="342" width="190" height="66" rx="9" fill="#eef2f7" stroke="#94a3b8"/><text x="54" y="368" font-weight="700" fill="#334155">Java</text><text x="54" y="390" fill="#64748b">宿主语言 / Java Caller</text>
    <rect x="240" y="342" width="190" height="66" rx="9" fill="#e7f6ee" stroke="#2fa572"/><text x="254" y="368" font-weight="700" fill="#1f7a5a">Groovy</text><text x="254" y="390" fill="#64748b">extension-groovy</text>
    <rect x="440" y="342" width="190" height="66" rx="9" fill="#e7f6ee" stroke="#2fa572"/><text x="454" y="368" font-weight="700" fill="#1f7a5a">OGNL</text><text x="454" y="390" fill="#64748b">extension-ognl（默认执行器）</text>
    <rect x="640" y="342" width="190" height="66" rx="9" fill="#d7efe1" stroke="#1f7a5a" stroke-width="2"/><text x="654" y="368" font-weight="700" fill="#166a4c">TinyScript</text><text x="654" y="390" fill="#64748b">antlr4-tinyscript（旧）</text>
    <rect x="840" y="342" width="190" height="66" rx="9" fill="#d7efe1" stroke="#1f7a5a" stroke-width="2"/><text x="854" y="368" font-weight="700" fill="#166a4c">Funic</text><text x="854" y="390" fill="#64748b">antlr4-funic（增强替代）</text>
    <rect x="1040" y="342" width="160" height="66" rx="9" fill="#eef2f7" stroke="#94a3b8"/><text x="1054" y="368" font-weight="700" fill="#334155">JavaScript</text><text x="1054" y="390" fill="#64748b">脚本混编</text>
  </g>
  <line x1="620" y1="188" x2="620" y2="340" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar15)"/>

  <!-- switch feature -->
  <text x="40" y="452" font-size="16" font-weight="700" fill="#1f2d3d">② 一键切换 Funic</text>
  <g font-size="12.5">
    <rect x="40" y="464" width="1160" height="64" rx="10" fill="#fbf1e6" stroke="#d09a4a"/>
    <text x="60" y="490" fill="#7c2d12" font-weight="700">配置 xproc4j.enable-funic=true</text>
    <text x="60" y="512" fill="#6b4f2a">→ 将默认 OGNL 执行器整体替换为 Funic 执行器，无需修改业务代码；当前阶段 Funic 已具备完全替代 TinyScript 的能力（详见 16 脚本引擎图）。</text>
  </g>

  <!-- tooling + mixins -->
  <text x="40" y="566" font-size="16" font-weight="700" fill="#1f2d3d">③ 配套工具与函数库</text>
  <g font-size="12.5">
    <rect x="40" y="578" width="380" height="78" rx="10" fill="#f3eefe" stroke="#8a63d2"/>
    <text x="58" y="602" font-weight="700" fill="#5b3a94">i2f-mixins（内建函数库）</text>
    <text x="58" y="622" fill="#475569">AllMixins 18 类混入 / 500+ 函数</text>
    <text x="58" y="642" fill="#94a3b8">ContextFunctions 承接入过程上下文</text>

    <rect x="430" y="578" width="380" height="78" rx="10" fill="#e8f0f8" stroke="#2e6da4"/>
    <text x="448" y="602" font-weight="700" fill="#1e4e79">XProc4J IDEA 插件</text>
    <text x="448" y="622" fill="#475569">i2f-tools/i2f-jdbc-procedure-idea-plugin</text>
    <text x="448" y="642" fill="#94a3b8">Gradle 独立构建 · 高亮/补全/断点/Oracle 转换</text>

    <rect x="820" y="578" width="380" height="78" rx="10" fill="#eef2f7" stroke="#94a3b8"/>
    <text x="838" y="602" font-weight="700" fill="#334155">运维集成</text>
    <text x="838" y="622" fill="#475569">springboot-ops-starter XProc4J 面板</text>
    <text x="838" y="642" fill="#94a3b8">存储过程调用 / 元数据查看 / 调试追踪</text>
  </g>

  <!-- footer: production -->
  <g font-size="12.5">
    <rect x="40" y="676" width="1160" height="112" rx="10" fill="#0f172a" opacity="0.92"/>
    <text x="60" y="704" font-size="15" font-weight="700" fill="#7dd3a0">生产实践（wiki 记载）</text>
    <text x="60" y="732" fill="#e2e8f0">· 已完成线上 Oracle 存储过程（含函数）向国产数据库迁移，覆盖 </text>
    <text x="640" y="732" fill="#fbbf24" font-weight="700">500+ 核心计算系统</text>
    <text x="60" y="756" fill="#e2e8f0">· 迁移过程代码 </text>
    <text x="180" y="756" fill="#fbbf24" font-weight="700">12 万+ 行</text>
    <text x="300" y="756" fill="#e2e8f0">，每日调度 </text>
    <text x="420" y="756" fill="#fbbf24" font-weight="700">2000+ 次</text>
    <text x="560" y="756" fill="#e2e8f0">，稳定运行 </text>
    <text x="680" y="756" fill="#fbbf24" font-weight="700">1 年+</text>
    <text x="60" y="780" fill="#94a3b8">· 官方文档：框架架构 / 设计思想 / 快速入门 / Oracle 过程转换 / XML 节点白皮书 / TinyScript·Funic 语法（docs/xproc4j-framework.md）</text>
  </g>
</svg>
