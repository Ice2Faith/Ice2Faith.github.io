<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfdff"/><stop offset="1" stop-color="#eef1f8"/>
    </linearGradient>
  </defs>
  <rect width="1240" height="800" fill="url(#bg6)"/>
  <text x="620" y="42" text-anchor="middle" font-size="29" font-weight="700" fill="#1f2d3d">关键框架 · 能力全景</text>
  <text x="620" y="70" text-anchor="middle" font-size="14" fill="#64748b">跨模块协作形成的 12 面旗舰能力，每卡标注定位、代表模块与亮点</text>

  <g font-size="11.5">
    <!-- grid 3x4, card 380x158 -->
    <!-- C1 XProc4J -->
    <g><rect x="25" y="92" width="380" height="158" rx="11" fill="#fff" stroke="#c7d2fe"/><rect x="25" y="92" width="7" height="158" rx="3" fill="#4338ca"/>
      <text x="48" y="120" font-size="17" font-weight="700" fill="#3730a3">XProc4J 存储过程编排</text>
      <text x="48" y="144" fill="#334155">基于 XML 的 JDBC 存储过程框架，多语言脚本混编</text>
      <text x="48" y="164" fill="#64748b">语法预检 · 脚本预热 · 依赖分析 · 事务控制</text>
      <text x="48" y="188" fill="#475569">extension-xproc4j / jdbc-procedure / starter</text>
      <text x="48" y="214" fill="#4338ca" font-weight="600">生产：500+ 系统 · 12 万行迁移 · 日调 2000+</text></g>
    <!-- C2 TinyScript/Funic -->
    <g><rect x="430" y="92" width="380" height="158" rx="11" fill="#fff" stroke="#c7d2fe"/><rect x="430" y="92" width="7" height="158" rx="3" fill="#4338ca"/>
      <text x="453" y="120" font-size="17" font-weight="700" fill="#3730a3">TinyScript → Funic</text>
      <text x="453" y="144" fill="#334155">ANTLR4 驱动的嵌入式脚本引擎</text>
      <text x="453" y="164" fill="#64748b">Funic 为增强替代：Lambda · go/await 并发 · 沙箱</text>
      <text x="453" y="188" fill="#475569">extension-antlr4（Funic.g4 575 行 / TinyScript.g4 397 行）</text>
      <text x="453" y="214" fill="#4338ca" font-weight="600">enable-funic=true 一键替换 OGNL 执行器</text></g>
    <!-- C3 AI toolchain -->
    <g><rect x="835" y="92" width="380" height="158" rx="11" fill="#fff" stroke="#fbcfe8"/><rect x="835" y="92" width="7" height="158" rx="3" fill="#be185d"/>
      <text x="858" y="120" font-size="17" font-weight="700" fill="#9d174d">AI 工具链</text>
      <text x="858" y="144" fill="#334155">平台无关 / 依赖无关的 AI 标准 + OpenAI 实现</text>
      <text x="858" y="164" fill="#64748b">Agent(Re-Act) · Function Calling · RAG · MCP</text>
      <text x="858" y="188" fill="#475569">ai-std / ai-rest-openai · @AiService 声明式</text>
      <text x="858" y="214" fill="#be185d" font-weight="600">兼容 OpenAI/DashScope/Ollama/vLLM</text></g>

    <!-- row2 y=270 -->
    <g><rect x="25" y="270" width="380" height="158" rx="11" fill="#fff" stroke="#bbf7d0"/><rect x="25" y="270" width="7" height="158" rx="3" fill="#15803d"/>
      <text x="48" y="298" font-size="17" font-weight="700" fill="#166534">统一文件系统抽象</text>
      <text x="48" y="322" fill="#334155">一套 API 统一 7 种存储后端</text>
      <text x="48" y="342" fill="#64748b">IFileSystem(25) / IFile(35+)，防路径遍历</text>
      <text x="48" y="366" fill="#475569">io-filesystem + filesystem-ftp/sftp/hdfs/…</text>
      <text x="48" y="392" fill="#15803d" font-weight="600">跨系统透明 copyTo / moveTo</text></g>
    <g><rect x="430" y="270" width="380" height="158" rx="11" fill="#fff" stroke="#bbf7d0"/><rect x="430" y="270" width="7" height="158" rx="3" fill="#0f766e"/>
      <text x="453" y="298" font-size="17" font-weight="700" fill="#0f766e">SQL 绑定 &amp; BQL</text>
      <text x="453" y="322" fill="#334155">零依赖 SQL 构建 + 四层递进动态查询</text>
      <text x="453" y="342" fill="#64748b">基础→Map→Lambda→Bean；Wrapper 体系</text>
      <text x="453" y="366" fill="#475569">bindsql / bql / bindsql-page</text>
      <text x="453" y="392" fill="#0f766e" font-weight="600">9 种方言分页 · 34 库方言重定向</text></g>
    <g><rect x="835" y="270" width="380" height="158" rx="11" fill="#fff" stroke="#bbf7d0"/><rect x="835" y="270" width="7" height="158" rx="3" fill="#0f766e"/>
      <text x="858" y="298" font-size="17" font-weight="700" fill="#0f766e">数据库元数据逆向工程</text>
      <text x="858" y="322" fill="#334155">数据库类型检测 + 元数据 + DDL 逆向</text>
      <text x="858" y="342" fill="#64748b">34 库类型枚举 · 8 专用实现 · Bean 生成</text>
      <text x="858" y="366" fill="#475569">database-type / metadata-{std,data,impl,bean}</text>
      <text x="858" y="392" fill="#0f766e" font-weight="600">方言代理驱动 jdbc:proxy:{方言}:…</text></g>

    <!-- row3 y=448 -->
    <g><rect x="25" y="448" width="380" height="158" rx="11" fill="#fff" stroke="#a5f3fc"/><rect x="25" y="448" width="7" height="158" rx="3" fill="#0891b2"/>
      <text x="48" y="476" font-size="17" font-weight="700" fill="#0e7490">日志体系</text>
      <text x="48" y="500" fill="#334155">门面标准 + 完整实现</text>
      <text x="48" y="520" fill="#64748b">ILogger · 三级 Provider 发现 · SPI</text>
      <text x="48" y="544" fill="#475569">log-std / log</text>
      <text x="48" y="570" fill="#0891b2" font-weight="600">控制台/文件/JDBC/广播 · out 重定向</text></g>
    <g><rect x="430" y="448" width="380" height="158" rx="11" fill="#fff" stroke="#a5f3fc"/><rect x="430" y="448" width="7" height="158" rx="3" fill="#0891b2"/>
      <text x="453" y="476" font-size="17" font-weight="700" fill="#0e7490">Mixin 混入函数库</text>
      <text x="453" y="500" fill="#334155">500+ 工具函数，implements 即得</text>
      <text x="453" y="520" fill="#64748b">18 混入接口聚合 AllMixins · 动态代理</text>
      <text x="453" y="544" fill="#475569">mixins（脚本引擎内建函数核心）</text>
      <text x="453" y="570" fill="#0891b2" font-weight="600">Funic/TinyScript/XProc4J 共用</text></g>
    <g><rect x="835" y="448" width="380" height="158" rx="11" fill="#fff" stroke="#fed7aa"/><rect x="835" y="448" width="7" height="158" rx="3" fill="#ea580c"/>
      <text x="858" y="476" font-size="17" font-weight="700" fill="#c2410c">二维 / 三维图形学</text>
      <text x="858" y="500" fill="#334155">纯 Java AWT 图形引擎</text>
      <text x="858" y="520" fill="#64748b">2D 变换/投影/贝塞尔；3D 渲染管线/Phong</text>
      <text x="858" y="544" fill="#475569">graphics-2d / graphics-3d</text>
      <text x="858" y="570" fill="#ea580c" font-weight="600">12 几何体 · 10 投影 · 20+ 材质 · 交互视窗</text></g>

    <!-- row4 y=626 -->
    <g><rect x="25" y="626" width="380" height="150" rx="11" fill="#fff" stroke="#fed7aa"/><rect x="25" y="626" width="7" height="150" rx="3" fill="#b45309"/>
      <text x="48" y="654" font-size="17" font-weight="700" fill="#92400e">JNI 原生调用体系</text>
      <text x="48" y="678" fill="#334155">Java 直访 Windows 底层 API</text>
      <text x="48" y="698" fill="#64748b">指针体系 + 库加载；918 native 方法</text>
      <text x="48" y="722" fill="#475569">native-core / -windows / -windows-easyx</text>
      <text x="48" y="746" fill="#b45309" font-weight="600">GDI/进程/注册表/服务/COM · EasyX 图形</text></g>
    <g><rect x="430" y="626" width="380" height="150" rx="11" fill="#fff" stroke="#fecdd3"/><rect x="430" y="626" width="7" height="150" rx="3" fill="#e11d48"/>
      <text x="453" y="654" font-size="17" font-weight="700" fill="#be123c">声明式 HTTP 客户端</text>
      <text x="453" y="678" fill="#334155">零依赖网络 + 注解驱动 Feign 式客户端</text>
      <text x="453" y="698" fill="#64748b">@RestClient + 动态代理；BIO/NIO/RMI</text>
      <text x="453" y="722" fill="#475569">network / http-proxy / starter</text>
      <text x="453" y="746" fill="#e11d48" font-weight="600">环境变量替换 · 多 Content-Type</text></g>
    <g><rect x="835" y="626" width="380" height="150" rx="11" fill="#fff" stroke="#fecdd3"/><rect x="835" y="626" width="7" height="150" rx="3" fill="#be123c"/>
      <text x="858" y="654" font-size="17" font-weight="700" fill="#9f1239">运维控制台 &amp; 全链路追踪</text>
      <text x="858" y="678" fill="#334155">内嵌 Web 运维面板 + TraceId 透传</text>
      <text x="858" y="698" fill="#64748b">ops：13+ 模块前端入 JAR；全链路国密</text>
      <text x="858" y="722" fill="#475569">ops-starter / trace-mdc-starter</text>
      <text x="858" y="746" fill="#be123c" font-weight="600">IOpsProvider SPI 扩展 · 10 追踪配置类</text></g>
  </g>
  <text x="620" y="792" text-anchor="middle" font-size="12" fill="#94a3b8">数据来源：.wiki/wiki.md「关键框架」章节</text>
</svg>
