<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 196" role="img" aria-label="意图识别辅助工具推荐流程">
<defs>
<marker id="ah10-ir" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e8590c"/></marker>
<marker id="ah10-ir-k" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#46607a"/></marker>
</defs>
<rect class="svg-node" x="20" y="40" width="160" height="62" rx="3"/>
<text class="svg-lbl" x="100" y="66" text-anchor="middle">① 提取用户消息</text>
<text class="svg-lbl-sm" x="100" y="84" text-anchor="middle">末条 user 消息</text>
<rect class="svg-node svg-node-acc" x="210" y="40" width="170" height="62" rx="3"/>
<text class="svg-lbl" x="295" y="66" text-anchor="middle">② 解析工具意图</text>
<text class="svg-lbl-sm" x="295" y="84" text-anchor="middle">@ToolIntent 注解 → label</text>
<rect class="svg-node svg-node-dark" x="410" y="40" width="190" height="62" rx="3"/>
<text class="svg-lbl-w" x="505" y="66" text-anchor="middle">③ LLM 意图识别</text>
<text class="svg-lbl-sm" x="505" y="84" text-anchor="middle" style="fill:#8fb3d6;">intent_recognize()</text>
<rect class="svg-node svg-node-teal" x="630" y="40" width="160" height="62" rx="3"/>
<text class="svg-lbl" x="710" y="66" text-anchor="middle">④ 重排 LRU 队列</text>
<text class="svg-lbl-sm" x="710" y="84" text-anchor="middle">推荐工具优先插入</text>
<rect class="svg-node svg-node-green" x="820" y="40" width="100" height="62" rx="3"/>
<text class="svg-lbl" x="870" y="66" text-anchor="middle">⑤ 过滤注入</text>
<text class="svg-lbl-sm" x="870" y="84" text-anchor="middle">LRU 窗口工具</text>
<path class="svg-line-acc flow-anim" d="M180,71 L210,71" marker-end="url(#ah10-ir)"/>
<path class="svg-line-acc flow-anim" d="M380,71 L410,71" marker-end="url(#ah10-ir)"/>
<path class="svg-line-acc flow-anim" d="M600,71 L630,71" marker-end="url(#ah10-ir)"/>
<path class="svg-line-acc flow-anim" d="M790,71 L820,71" marker-end="url(#ah10-ir)"/>
<text class="svg-lbl-sm" x="20" y="138">仅在最后一条消息为 user 时触发 · 保留 25% 原 LRU 队列头部（最少 3 个）</text>
<text class="svg-lbl-sm" x="20" y="156">推荐工具优先插入队列 · 保留的原队列工具补充到尾部 · 最终由 LRU 窗口截断</text>
<text class="svg-lbl-sm" x="20" y="174">回显 <code>echo_tool_intent_recommend</code> 事件：包含完整 prompt / rawResult / finalResult，意图识别过程全程可见</text>
</svg>
