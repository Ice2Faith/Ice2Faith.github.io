<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" role="img" aria-label="核心消息循环图">
    <!-- 连接曲线 -->
    <path class="svg-line-acc flow-anim" d="M170,72 Q230,90 262,150" marker-end="url(#ah-o)"/>
    <path class="svg-line-teal flow-anim" d="M428,168 Q480,120 500,92" marker-end="url(#ah-t)"/>
    <path class="svg-line svg-dash" d="M470,88 Q420,140 400,162" marker-end="url(#ah-k)"/>
