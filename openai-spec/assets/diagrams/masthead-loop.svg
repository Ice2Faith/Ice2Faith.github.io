    <text class="svg-lbl-acc" x="452" y="140" style="fill:#0b7285;">②</text>
    <text class="svg-lbl-sm" x="452" y="128" style="fill:#46607a;">③</text>
    <text class="svg-lbl-acc" x="324" y="276">④</text>
    <text class="svg-lbl-sm" x="248" y="276">⑤</text>
    <text class="svg-lbl-acc" x="148" y="160" style="fill:#0b7285;">⑥</text>
    <!-- 图例 -->
    <text class="svg-lbl-sm" x="20" y="404">① 加密请求 ② 组装报文→推理 ③ tool_calls/chunk 返回 ④ 契约解析·并行执行 ⑤ ToolMessage 回填 ⑥ SSE 中继</text>
