    <defs>
        <marker id="ah-o" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
            <path d="M0,0 L9,4.5 L0,9 Z" fill="#e8590c"/>
        </marker>
        <marker id="ah-t" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
            <path d="M0,0 L9,4.5 L0,9 Z" fill="#0b7285"/>
        </marker>
        <marker id="ah-k" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
            <path d="M0,0 L9,4.5 L0,9 Z" fill="#46607a"/>
        </marker>
    </defs>
    <!-- 节点 -->
    <rect class="svg-node" x="20" y="26" width="152" height="62" rx="3"/>
    <text class="svg-lbl" x="96" y="52" text-anchor="middle">用户终端</text>
    <text class="svg-lbl-sm" x="96" y="70" text-anchor="middle">Vue2 · ElementUI · SM-Crypto</text>
    <rect class="svg-node svg-node-dark pulse-node" x="228" y="150" width="176" height="80" rx="3"/>
    <text class="svg-lbl-w" x="316" y="180" text-anchor="middle">OpenAiOpsController</text>
    <text class="svg-lbl-sm" x="316" y="198" text-anchor="middle" style="fill:#8fb3d6;">消息编排 · 提示词注入</text>
    <text class="svg-lbl-sm" x="316" y="214" text-anchor="middle" style="fill:#8fb3d6;">SSE 中继 · 工具调度</text>
    <rect class="svg-node svg-node-acc" x="392" y="26" width="150" height="62" rx="3"/>
