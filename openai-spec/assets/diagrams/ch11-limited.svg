<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 236" role="img" aria-label="请求限流三层令牌桶">
    <defs>
        <marker id="ah11l-t" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
            <path d="M0,0 L9,4.5 L0,9 Z" fill="#0b7285"/>
        </marker>
        <marker id="ah11l-o" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
            <path d="M0,0 L9,4.5 L0,9 Z" fill="#e8590c"/>
        </marker>
    </defs>
    <text class="svg-lbl-sm" x="20" y="26" style="fill:#0b7285;letter-spacing:.18em;">FILTER ·
        OpsLimitedRequestFilter（FilterRegistrationBean order=1，url-pattern 默认 {base-url}/*）
    </text>

    <rect class="svg-node svg-node-dark" x="20" y="40" width="132" height="74" rx="3"/>
    <text class="svg-lbl-w" x="86" y="68" text-anchor="middle">HTTP 请求</text>
    <text class="svg-lbl-sm" x="86" y="86" text-anchor="middle" style="fill:#c9d1d9;">/ops/**</text>
    <text class="svg-lbl-sm" x="86" y="102" text-anchor="middle" style="fill:#c9d1d9;">一次取 1 令牌</text>

    <rect class="svg-node svg-node-teal" x="182" y="40" width="170" height="74" rx="3"/>
    <text class="svg-lbl" x="267" y="62" text-anchor="middle">① 全局 all-rule</text>
    <text class="svg-lbl-sm" x="267" y="80" text-anchor="middle">ops:limited:all</text>
    <text class="svg-lbl-sm" x="267" y="98" text-anchor="middle">100/s · 容量 300</text>

    <rect class="svg-node svg-node-teal" x="382" y="40" width="186" height="74" rx="3"/>
    <text class="svg-lbl" x="475" y="62" text-anchor="middle">② 每 IP every-ip-rule</text>
    <text class="svg-lbl-sm" x="475" y="80" text-anchor="middle">ops:limited:ip:{ip}</text>
    <text class="svg-lbl-sm" x="475" y="98" text-anchor="middle">LruMap 8192 淘汰旧桶</text>

    <rect class="svg-node svg-node-acc" x="598" y="40" width="176" height="74" rx="3"/>
    <text class="svg-lbl" x="686" y="62" text-anchor="middle">③ ANT 路径 path-rules</text>
    <text class="svg-lbl-sm" x="686" y="80" text-anchor="middle">AntMatcher 命中才计数</text>
    <text class="svg-lbl-sm" x="686" y="98" text-anchor="middle">20/s · 容量 50</text>

    <rect class="svg-node svg-node-dark" x="804" y="40" width="116" height="74" rx="3"/>
    <text class="svg-lbl-w" x="862" y="68" text-anchor="middle">chain.doFilter</text>
    <text class="svg-lbl-sm" x="862" y="86" text-anchor="middle" style="fill:#c9d1d9;">→ Controller</text>
    <text class="svg-lbl-sm" x="862" y="102" text-anchor="middle" style="fill:#c9d1d9;">→ SSE 流</text>

    <path class="svg-line-teal flow-anim" d="M152,77 L182,77" marker-end="url(#ah11l-t)"/>
    <path class="svg-line-teal flow-anim" d="M352,77 L382,77" marker-end="url(#ah11l-t)"/>
    <path class="svg-line-acc flow-anim" d="M568,77 L598,77" marker-end="url(#ah11l-o)"/>
    <path class="svg-line flow-anim" d="M774,77 L804,77" marker-end="url(#ah11l-o)"/>

    <path class="svg-line svg-dash" d="M267,114 L267,134"/>
    <path class="svg-line svg-dash" d="M475,114 L475,134"/>
    <path class="svg-line svg-dash" d="M686,114 L686,134"/>
    <path class="svg-line svg-dash" d="M267,134 L686,134"/>
    <path class="svg-line-acc svg-dash" d="M475,134 L475,158" marker-end="url(#ah11l-o)"/>
    <text class="svg-lbl-sm" x="486" y="150">任一层 tryAcquire(1, SECONDS) 失败</text>

    <rect class="svg-node svg-node-acc" x="182" y="160" width="592" height="56" rx="3"/>
    <text class="svg-lbl" x="478" y="182" text-anchor="middle">OpsLimitedException → 429 text/html（global / ip / path
        limited）
    </text>
    <text class="svg-lbl-sm" x="478" y="201" text-anchor="middle">先判 response.isCommitted() 再 reset
        写回；下游抛出的同类异常走同一出口
    </text>
</svg>
