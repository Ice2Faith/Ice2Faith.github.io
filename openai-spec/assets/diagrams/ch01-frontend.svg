<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 306" role="img" aria-label="前端层展开图">
    <defs>
        <marker id="fe-t" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
            <path d="M0,0 L9,4.5 L0,9 Z" fill="#0b7285"/>
        </marker>
        <marker id="fe-g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
            <path d="M0,0 L9,4.5 L0,9 Z" fill="#2f9e44"/>
        </marker>
    </defs>
    <text class="svg-lbl-sm" x="20" y="26" style="fill:#0b7285;letter-spacing:.18em;">LAYER 1 · 前端 — 浏览器一侧的
        Agent 状态机（Vue2 · ElementUI · SM-Crypto）
    </text>

    <rect class="svg-node svg-node-teal" x="20" y="42" width="196" height="72" rx="3"/>
    <text class="svg-lbl" x="118" y="70" text-anchor="middle">① 输入 · 会话 · 预设</text>
    <text class="svg-lbl-sm" x="118" y="94" text-anchor="middle">22+ 供应商 · 角色 · 多会话</text>

    <rect class="svg-node svg-node-teal" x="256" y="42" width="196" height="72" rx="3"/>
    <text class="svg-lbl" x="354" y="70" text-anchor="middle">② messages[] 唯一真相</text>
    <text class="svg-lbl-sm" x="354" y="94" text-anchor="middle">历史 · 工具调用与结果 · 引用</text>

    <rect class="svg-node svg-node-teal" x="492" y="42" width="196" height="72" rx="3"/>
    <text class="svg-lbl" x="590" y="70" text-anchor="middle">③ 加密后一次性提交</text>
    <text class="svg-lbl-sm" x="590" y="94" text-anchor="middle">POST /ops/open-ai/stream</text>

    <rect class="svg-node svg-node-teal pulse-soft" x="728" y="42" width="192" height="72" rx="3"/>
    <text class="svg-lbl" x="824" y="70" text-anchor="middle">④ 5 分钟 SSE 长连接</text>
    <text class="svg-lbl-sm" x="824" y="94" text-anchor="middle">chunk · reasoning · echo_*</text>

    <path class="svg-line-teal flow-anim" d="M216,78 L256,78" marker-end="url(#fe-t)"/>
    <path class="svg-line-teal flow-anim" d="M452,78 L492,78" marker-end="url(#fe-t)"/>
    <path class="svg-line-teal flow-anim" d="M688,78 L728,78" marker-end="url(#fe-t)"/>
    <path class="svg-line flow-anim flow-slow" d="M824,114 C824,158 120,140 120,180" marker-end="url(#fe-g)"/>

    <rect class="svg-node svg-node-green" x="20" y="180" width="288" height="72" rx="3"/>
    <text class="svg-lbl" x="164" y="208" text-anchor="middle">⑤ 事件驱动的视图编排</text>
    <text class="svg-lbl-sm" x="164" y="232" text-anchor="middle">Markdown · 思考过程 · 工具卡片 · 审批弹窗</text>

    <rect class="svg-node svg-node-green" x="326" y="180" width="288" height="72" rx="3"/>
    <text class="svg-lbl" x="470" y="208" text-anchor="middle">⑥ 浏览器端工具委托</text>
    <text class="svg-lbl-sm" x="470" y="232" text-anchor="middle">BS 工具在本机执行后回填工具结果</text>

    <rect class="svg-node svg-node-green" x="632" y="180" width="288" height="72" rx="3"/>
    <text class="svg-lbl" x="776" y="208" text-anchor="middle">⑦ 本地持久化与压缩</text>
    <text class="svg-lbl-sm" x="776" y="232" text-anchor="middle">localStorage 跨轮接力 · ref:// 回收</text>

    <path class="svg-line-teal flow-anim flow-slow" d="M308,216 L326,216" marker-end="url(#fe-t)"/>
    <path class="svg-line-teal flow-anim flow-slow" d="M614,216 L632,216" marker-end="url(#fe-t)"/>
    <text class="svg-lbl-sm" x="20" y="290">要点：状态机与消息列表都在浏览器，服务端不保存会话；刷新页面靠 localStorage
        接力，工具执行可下放到前端
    </text>
</svg>
