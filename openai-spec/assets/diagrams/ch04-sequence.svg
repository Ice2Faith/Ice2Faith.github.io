<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" role="img" aria-label="SSE 对话时序图">
<defs>
<marker id="sq-ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#152a42"/></marker>
<marker id="sq-ah-o" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e8590c"/></marker>
</defs>
<!-- 生命线头 -->
<rect class="svg-node" x="40" y="16" width="140" height="40" rx="3"/>
<text class="svg-lbl" x="110" y="41" text-anchor="middle">前端 Vue2</text>
<rect class="svg-node svg-node-dark" x="300" y="16" width="180" height="40" rx="3"/>
<text class="svg-lbl-w" x="390" y="41" text-anchor="middle">OpenAiOpsController</text>
<rect class="svg-node svg-node-teal" x="560" y="16" width="130" height="40" rx="3"/>
<text class="svg-lbl" x="625" y="41" text-anchor="middle">工具池 toolPool</text>
<rect class="svg-node svg-node-acc" x="744" y="16" width="110" height="40" rx="3"/>
<text class="svg-lbl" x="799" y="41" text-anchor="middle">LLM</text>
<!-- 生命线 -->
<line class="svg-line svg-dash" x1="110" y1="56" x2="110" y2="590"/>
<line class="svg-line svg-dash" x1="390" y1="56" x2="390" y2="590"/>
<line class="svg-line svg-dash" x1="625" y1="56" x2="625" y2="590"/>
<line class="svg-line svg-dash" x1="799" y1="56" x2="799" y2="590"/>
<!-- 消息 -->
<line class="svg-line" x1="110" y1="92" x2="384" y2="92" marker-end="url(#sq-ah)"/>
<text class="svg-lbl-sm" x="130" y="86">1. POST /stream（OpsSecureDto · SM4 加密报文）</text>
<rect x="382" y="104" width="16" height="66" fill="#fff4ec" stroke="#e8590c"/>
<text class="svg-lbl-sm" x="408" y="120">2. 解密 · 组装 CompletionDto</text>
<text class="svg-lbl-sm" x="408" y="138">3. 注入：事实 / 循环工程 / 技能 / LRU 系统提示词</text>
<text class="svg-lbl-sm" x="408" y="156">4. 附件 &lt;upload_files&gt; 追加到用户消息</text>
<line class="svg-line" x1="384" y1="190" x2="116" y2="190" marker-end="url(#sq-ah)"/>
<text class="svg-lbl-sm" x="130" y="184">5. SSE：definition_tool / echo_skill / echo_dynamic_tool / echo_loop_engineering / echo_truth_prompt / echo_truth_content / echo_session_records_map 事件</text>
<line class="svg-line" x1="390" y1="228" x2="619" y2="228" marker-end="url(#sq-ah)"/>
<text class="svg-lbl-sm" x="404" y="222">6. 末消息含 tool_calls → 并行提交（审批检查）</text>
<line class="svg-line" x1="619" y1="262" x2="396" y2="262" marker-end="url(#sq-ah)"/>
<text class="svg-lbl-sm" x="404" y="256">7. 执行结果 → ToolMessage（CountDownLatch 汇聚）</text>
<line class="svg-line" x1="384" y1="296" x2="116" y2="296" marker-end="url(#sq-ah)"/>
<text class="svg-lbl-sm" x="130" y="290">8. SSE：echo_tool（回显）+ tool（回填消息）</text>
<line class="svg-line-acc" x1="390" y1="336" x2="793" y2="336" marker-end="url(#sq-ah-o)"/>
<text class="svg-lbl-sm" x="470" y="330">9. POST {baseUrl}/chat/completions（SSE 流）</text>
<line class="svg-line svg-dash" x1="793" y1="372" x2="396" y2="372" marker-end="url(#sq-ah)"/>
<text class="svg-lbl-sm" x="470" y="366">10. data: {"choices":[...]} chunk 流</text>
<line class="svg-line" x1="384" y1="406" x2="116" y2="406" marker-end="url(#sq-ah)"/>
<text class="svg-lbl-sm" x="130" y="400">11. SSE：assistant chunk 中继（可选 SM4 输出加密）</text>
<line class="svg-line svg-dash" x1="793" y1="444" x2="396" y2="444" marker-end="url(#sq-ah)"/>
<text class="svg-lbl-sm" x="470" y="438">12. [DONE]</text>
<line class="svg-line" x1="384" y1="478" x2="116" y2="478" marker-end="url(#sq-ah)"/>
<text class="svg-lbl-sm" x="130" y="472">13. SSE：[DONE] → emitter.complete()</text>
<!-- 循环框 -->
<rect x="360" y="208" width="300" height="100" fill="none" stroke="#0b7285" stroke-dasharray="5 4"/>
<text class="svg-lbl-sm" x="366" y="222" style="fill:#0b7285;">loop [ 每个 tool_call 契约 ]</text>
<text class="svg-lbl-sm" x="110" y="530" text-anchor="start" style="fill:#7b90a5;">异常路径：任何阶段抛错 → OpsSecureReturn.error(e) 加密回传 → emitter.completeWithError</text>
<text class="svg-lbl-sm" x="110" y="552" text-anchor="start" style="fill:#7b90a5;">生命周期回调：onCompletion / onTimeout / onError 均清理 AgentTools.REQUEST_HOLDER（ThreadLocal 防泄漏）</text>
</svg>
