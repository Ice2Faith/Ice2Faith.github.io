<svg viewBox="0 0 820 400" role="img" aria-label="Re-Act 循环图">
<defs>
<marker id="ra-ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e8590c"/></marker>
<marker id="ra-ah-g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2b8a3e"/></marker>
</defs>
<!-- 循环弧 -->
<path class="svg-line-acc flow-anim" d="M300,84 A150,150 0 0 1 480,120" marker-end="url(#ra-ah)"/>
<path class="svg-line-acc flow-anim" d="M520,180 A150,150 0 0 1 480,300" marker-end="url(#ra-ah)"/>
<path class="svg-line-acc flow-anim" d="M400,336 A150,150 0 0 1 240,300" marker-end="url(#ra-ah)"/>
<path class="svg-line-acc flow-anim" d="M200,240 A150,150 0 0 1 230,120" marker-end="url(#ra-ah)"/>
<!-- 节点 -->
<rect class="svg-node" x="230" y="44" width="150" height="44" rx="3"/>
<text class="svg-lbl" x="305" y="71" text-anchor="middle">① 历史压缩 / 截断</text>
<rect class="svg-node svg-node-dark" x="452" y="96" width="168" height="44" rx="3"/>
<text class="svg-lbl-w" x="536" y="123" text-anchor="middle">② 模型推理 generate()</text>
<rect class="svg-node svg-node-acc" x="430" y="276" width="190" height="44" rx="3"/>
<text class="svg-lbl" x="525" y="303" text-anchor="middle">③ finishReason 判定</text>
<rect class="svg-node svg-node-teal" x="150" y="276" width="180" height="44" rx="3"/>
<text class="svg-lbl" x="240" y="303" text-anchor="middle">④ 工具并行执行</text>
<rect class="svg-node" x="140" y="96" width="170" height="44" rx="3"/>
<text class="svg-lbl" x="225" y="123" text-anchor="middle">⑤ ToolMessage 回填</text>
<!-- 中心 -->
<circle cx="380" cy="205" r="58" fill="#fff4ec" stroke="#e8590c" stroke-width="1.6"/>
<text class="svg-lbl" x="380" y="198" text-anchor="middle" style="fill:#e8590c;">Re-Act</text>
<text class="svg-lbl-sm" x="380" y="218" text-anchor="middle">Reasoning</text>
<text class="svg-lbl-sm" x="380" y="233" text-anchor="middle">+ Acting</text>
<!-- 出口 -->
<path class="svg-line" d="M620,298 L700,298" stroke="#2b8a3e" stroke-width="1.8" marker-end="url(#ra-ah-g)"/>
<rect class="svg-node svg-node-green" x="700" y="276" width="110" height="44" rx="3"/>
<text class="svg-lbl" x="755" y="303" text-anchor="middle">最终答复</text>
<text class="svg-lbl-sm" x="628" y="290" style="fill:#2b8a3e;">STOP</text>
<text class="svg-lbl-sm" x="560" y="270" style="fill:#e8590c;">TOOL_CALL</text>
<!-- 限制说明 -->
<text class="svg-lbl-sm" x="20" y="372">护栏：全局调用上限 100 · 单工具上限 10 · 同参数失败上限 2 · 消息保留 ≤20 · 16 条触发压缩 · 支持中断标志</text>
</svg>
