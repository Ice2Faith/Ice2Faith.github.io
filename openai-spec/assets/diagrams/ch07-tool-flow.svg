<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 286" role="img" aria-label="工具注册与调用流程">
<defs>
<marker id="ah7-o" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e8590c"/></marker>
<marker id="ah7-t" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0b7285"/></marker>
</defs>
<text class="svg-lbl-sm" x="20" y="26" style="fill:#0b7285;letter-spacing:.18em;">REGISTER · 注册阶段（应用启动，一次完成）</text>
<text class="svg-lbl-sm" x="20" y="168" style="fill:#e8590c;letter-spacing:.18em;">INVOKE · 调用阶段（每轮对话，按需触发）</text>
<line class="svg-line svg-dash" x1="20" y1="142" x2="920" y2="142"/>
<rect class="svg-node svg-node-teal" x="20" y="42" width="196" height="62" rx="3"/>
<text class="svg-lbl" x="118" y="68" text-anchor="middle">@Tool 注解方法</text>
<text class="svg-lbl-sm" x="118" y="86" text-anchor="middle">Spring Bean · 反射扫描</text>
<rect class="svg-node svg-node-teal" x="256" y="42" width="196" height="62" rx="3"/>
<text class="svg-lbl" x="354" y="68" text-anchor="middle">ToolDefinition</text>
<text class="svg-lbl-sm" x="354" y="86" text-anchor="middle">name · description · tags</text>
<rect class="svg-node svg-node-teal" x="492" y="42" width="196" height="62" rx="3"/>
<text class="svg-lbl" x="590" y="68" text-anchor="middle">JSON Schema</text>
<text class="svg-lbl-sm" x="590" y="86" text-anchor="middle">参数类型映射 · required</text>
<rect class="svg-node svg-node-teal" x="728" y="42" width="192" height="62" rx="3"/>
<text class="svg-lbl" x="824" y="68" text-anchor="middle">OpenAI tools 字段</text>
<text class="svg-lbl-sm" x="824" y="86" text-anchor="middle">随补全请求上报 LLM</text>
<path class="svg-line-teal flow-anim" d="M216,73 L256,73" marker-end="url(#ah7-t)"/>
<path class="svg-line-teal flow-anim" d="M452,73 L492,73" marker-end="url(#ah7-t)"/>
<path class="svg-line-teal flow-anim" d="M688,73 L728,73" marker-end="url(#ah7-t)"/>
<path class="svg-line svg-dash" d="M824,104 C824,152 120,132 120,182" marker-end="url(#ah7-o)"/>
<rect class="svg-node svg-node-acc" x="20" y="184" width="196" height="62" rx="3"/>
<text class="svg-lbl" x="118" y="210" text-anchor="middle">LLM 返回 tool_calls</text>
<text class="svg-lbl-sm" x="118" y="228" text-anchor="middle">assistant 消息携带契约</text>
<rect class="svg-node svg-node-acc" x="256" y="184" width="196" height="62" rx="3"/>
<text class="svg-lbl" x="354" y="210" text-anchor="middle">HITL 人工审批</text>
<text class="svg-lbl-sm" x="354" y="228" text-anchor="middle">批准 · 拒绝 · 编辑参数</text>
<rect class="svg-node svg-node-acc" x="492" y="184" width="196" height="62" rx="3"/>
<text class="svg-lbl" x="590" y="210" text-anchor="middle">CountDownLatch 并行执行</text>
<text class="svg-lbl-sm" x="590" y="228" text-anchor="middle">ToolManager.callTool</text>
<rect class="svg-node svg-node-dark" x="728" y="184" width="192" height="62" rx="3"/>
<text class="svg-lbl-w" x="824" y="210" text-anchor="middle">ToolMessage 回填</text>
<text class="svg-lbl-sm" x="824" y="228" text-anchor="middle" style="fill:#8fb3d6;">tool_call_id 关联契约</text>
<path class="svg-line-acc flow-anim" d="M216,215 L256,215" marker-end="url(#ah7-o)"/>
<path class="svg-line-acc flow-anim" d="M452,215 L492,215" marker-end="url(#ah7-o)"/>
<path class="svg-line-acc flow-anim" d="M688,215 L728,215" marker-end="url(#ah7-o)"/>
<text class="svg-lbl-sm" x="20" y="272">回填后的消息列表进入下一轮推理，直至 LLM 不再返回 tool_calls —— 这正是第 05 章 Re-Act 循环在工具侧的投影</text>
</svg>
