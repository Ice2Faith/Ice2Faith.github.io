<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 310" role="img" aria-label="MCP 上下文传递流程">
<defs>
<marker id="ctx-ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e8590c"/></marker>
<marker id="ctx-ah-t" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0b7285"/></marker>
</defs>
<rect class="svg-node svg-node-dark" x="20" y="20" width="420" height="110" rx="3"/>
<text class="svg-lbl-w" x="230" y="48" text-anchor="middle">AI 主控服务 (MCP Client)</text>
<text class="svg-lbl-sm" x="40" y="72" style="fill:#8fb3d6;">① Controller: ToolCallContextHolder.put("req", req)</text>
<text class="svg-lbl-sm" x="40" y="92" style="fill:#8fb3d6;">② HttpSimpleMcpClientToolProvider.callTool():</text>
<text class="svg-lbl-sm" x="60" y="112" style="fill:#7b90a5;">Map ctx = ToolCallContextHolder.copyOf()</text>
<text class="svg-lbl-sm" x="60" y="128" style="fill:#7b90a5;">payloadDto.setContext(jsonSerializer.serialize(ctx))</text>
<rect class="svg-node svg-node-acc" x="480" y="20" width="440" height="110" rx="3"/>
<text class="svg-lbl" x="700" y="48" text-anchor="middle">HTTP POST /mcp/tool/call</text>
<text class="svg-lbl-sm" x="500" y="72">Body: {</text>
<text class="svg-lbl-sm" x="520" y="92" style="fill:#7b90a5;">"content": "{...tool call request...}",</text>
<text class="svg-lbl-sm" x="520" y="112" style="fill:#e8590c;">"context": "{\"req\":{...}}" ← 上下文序列化</text>
<text class="svg-lbl-sm" x="500" y="128">}</text>
<path class="svg-line-acc flow-anim" d="M440,75 L480,75" marker-end="url(#ctx-ah)"/>
<rect class="svg-node svg-node-teal" x="20" y="170" width="420" height="120" rx="3"/>
<text class="svg-lbl" x="230" y="198" text-anchor="middle">远程工具服务 (MCP Server)</text>
<text class="svg-lbl-sm" x="40" y="222">③ Controller / Handler:</text>
<text class="svg-lbl-sm" x="60" y="242" style="fill:#7b90a5;">Map ctx = jsonSerializer.deserializeAsMap(context)</text>
<text class="svg-lbl-sm" x="60" y="262" style="fill:#e8590c;">ToolCallContextHolder.replaceAs(ctx) ← 恢复上下文</text>
<text class="svg-lbl-sm" x="40" y="282">④ finally: ToolCallContextHolder.clear() ← 防泄漏</text>
<path class="svg-line-teal flow-anim" d="M440,225 L480,225" marker-end="url(#ctx-ah-t)"/>
<text class="svg-lbl-sm" x="445" y="218" style="fill:#0b7285;">HMAC 签名含 context</text>
</svg>
