<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 216" role="img" aria-label="MCP 动态工具三步发现与 LRU 流程">
<defs>
<marker id="ah10-o" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e8590c"/></marker>
<marker id="ah10-k" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#46607a"/></marker>
</defs>
<rect class="svg-node svg-node-acc" x="20" y="40" width="200" height="62" rx="3"/>
<text class="svg-lbl" x="120" y="66" text-anchor="middle">① tools_provider_list</text>
<text class="svg-lbl-sm" x="120" y="84" text-anchor="middle">列举 MCP 工具供应商</text>
<rect class="svg-node svg-node-acc" x="252" y="40" width="224" height="62" rx="3"/>
<text class="svg-lbl" x="364" y="66" text-anchor="middle">② list_tools_from_providers</text>
<text class="svg-lbl-sm" x="364" y="84" text-anchor="middle">按供应商查看工具清单</text>
<rect class="svg-node svg-node-acc" x="508" y="40" width="212" height="62" rx="3"/>
<text class="svg-lbl" x="614" y="66" text-anchor="middle">③ load_tools_by_names</text>
<text class="svg-lbl-sm" x="614" y="84" text-anchor="middle">装载所需工具入当前会话</text>
<rect class="svg-node svg-node-dark pulse-node" x="752" y="40" width="168" height="62" rx="3"/>
<text class="svg-lbl-w" x="836" y="66" text-anchor="middle">LRU 队列</text>
<text class="svg-lbl-sm" x="836" y="84" text-anchor="middle" style="fill:#8fb3d6;">容量 lruToolMaxSize</text>
<path class="svg-line-acc flow-anim" d="M220,71 L252,71" marker-end="url(#ah10-o)"/>
<path class="svg-line-acc flow-anim" d="M476,71 L508,71" marker-end="url(#ah10-o)"/>
<path class="svg-line-acc flow-anim" d="M720,71 L752,71" marker-end="url(#ah10-o)"/>
<path class="svg-line svg-dash" d="M836,102 L836,140" marker-end="url(#ah10-k)"/>
<rect class="svg-node" x="700" y="142" width="220" height="52" rx="3"/>
<text class="svg-lbl" x="810" y="164" text-anchor="middle">超容量 → 淘汰最久未用</text>
<text class="svg-lbl-sm" x="810" y="182" text-anchor="middle">echo_lru_tools 同步前端</text>
<text class="svg-lbl-sm" x="20" y="162">LLM 视角：先「查字典目录」，再「翻到对应页」——</text>
<text class="svg-lbl-sm" x="20" y="180">工具定义按需进入上下文，token 消耗从 O(全部工具) 降为 O(当前任务所需)</text>
</svg>
